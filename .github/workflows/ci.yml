name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Swift test and app verification
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Report Swift toolchain
        run: swift --version

      - name: Run Swift tests
        run: swift test --enable-swift-testing --no-parallel --filter BloomFileManagerTests

      - name: Verify app bundle and native linkage
        run: ./script/build_and_run.sh --verify

      - name: Run package contract checks
        run: /bin/bash script/tests/package_release_contract_tests.sh
